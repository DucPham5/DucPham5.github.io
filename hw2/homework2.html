<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="HW2" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="homework2.css">
    <script src="homework2.js"></script>
    <title>HW2</title>
</head>
<body>
    <div id="header">
        <img src="medicallogo.jpg" alt="logo" id="logo">
        <h1>Cedarwood Medical Center</h1>
        <p>Today is: <span id="currentDate"></span></p>
    </div>
    <div id="body-content">
        <div class="paper">
            <form action="homework2-thankyou.html" onsubmit="validateForm()">

                <table class="form">

                    <th class="form" colspan="3">Patient Form</th>

                    <tr><!--First / MI / Last-->
                        <td><label for="fullName">Name:</label></td>
                        <td colspan="3">
                            <input type="text" id="firstName" name="firstName" maxlength="30"
                                pattern="[A-Za-z'-]{1,30}"
                                title="1-30 letters only. Apostrophes and dashes allowed."
                                placeholder="First" required
                                onblur="validateFirstName()">
                            <span id="firstNameMsg" class="errorMsg"></span>
                            <br>
                            <input type="text" id="middleInitial" name="middleInitial" maxlength="1"
                                style="width:40px" placeholder="MI"
                                pattern="[A-Za-z]"
                                title="Middle initial must be one letter only"
                                onblur="validateMiddleInitial()">
                            <span id="middleInitialMsg" class="errorMsg"></span>
                            <br>
                            <input type="text" id="lastName" name="lastName" maxlength="30"
                                placeholder="Last"
                                pattern="[A-Za-z'2-5-]{1,30}"
                                title="1-30 characters. Letters, apostrophes, dashes, and numbers 2-5 only."
                                required
                                onblur="validateLastName()">
                            <span id="lastNameMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--DOB-->
                        <td><label for="dob">Date of Birth:</label></td>
                        <td>
                            <input type="date" id="dob" name="dob"
                                min="1903-03-27" max="2026-03-27"
                                title="Date of birth: cannot be in the future or more than 120 years ago"
                                required
                                onblur="validateDOB()">
                            <span id="dobMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Phone-->
                        <td><label for="phone">Phone Number:</label></td>
                        <td>
                            <input type="text" id="phone" name="phone"
                                placeholder="(000)-000-0000"
                                pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                                title="Must be 10-digit phone number in the format 000-000-0000"
                                required
                                onblur="validatePhone()">
                            <span id="phoneMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--SSN-->
                        <td><label for="ssn">Social Security Number:</label></td>
                        <td>
                            <input type="password" id="ssn" name="ssn"
                                maxlength="7"
                                pattern="[0-9]{7}"
                                placeholder="0000000"
                                title="Exactly 7 digits, numbers only"
                                required
                                onblur="validateSSN()">
                            <span id="ssnMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Address1-->
                        <td><label for="address1">Address Line 1:</label></td>
                        <td>
                            <input type="text" id="address1" name="address1"
                                pattern=".{2,30}"
                                title="Address Line 1: 2-30 characters required"
                                required
                                onblur="validateAddress1()">
                            <span id="address1Msg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Address2-->
                        <td><label for="address2">Address Line 2:</label></td>
                        <td>
                            <input type="text" id="address2" name="address2"
                                pattern=".{2,30}"
                                title="Address Line 2: 2-30 characters if entered"
                                onblur="validateAddress2()">
                            <span id="address2Msg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--City/State/ZIP-->
                        <td><label for="cityStateZip">City / State / ZIP:</label></td>
                        <td>
                            <input type="text" id="city" name="city"
                                placeholder="City"
                                style="width:120px; margin-right:5px;"
                                pattern=".{2,30}"
                                title="City: 2-30 characters required"
                                required
                                onblur="validateCity()">
                            <span id="cityMsg" class="errorMsg"></span>

                            <select id="state" name="state" required
                                style="width:100px; margin-right:5px;"
                                onblur="validateState()">
                                <option value=""></option>
                                <option value="AL">Alabama</option>
                                <option value="AK">Alaska</option>
                                <option value="AZ">Arizona</option>
                                <option value="AR">Arkansas</option>
                                <option value="CA">California</option>
                                <option value="CO">Colorado</option>
                                <option value="CT">Connecticut</option>
                                <option value="DE">Delaware</option>
                                <option value="DC">District Of Columbia</option>
                                <option value="FL">Florida</option>
                                <option value="GA">Georgia</option>
                                <option value="HI">Hawaii</option>
                                <option value="ID">Idaho</option>
                                <option value="IL">Illinois</option>
                                <option value="IN">Indiana</option>
                                <option value="IA">Iowa</option>
                                <option value="KS">Kansas</option>
                                <option value="KY">Kentucky</option>
                                <option value="LA">Louisiana</option>
                                <option value="ME">Maine</option>
                                <option value="MD">Maryland</option>
                                <option value="MA">Massachusetts</option>
                                <option value="MI">Michigan</option>
                                <option value="MN">Minnesota</option>
                                <option value="MS">Mississippi</option>
                                <option value="MO">Missouri</option>
                                <option value="MT">Montana</option>
                                <option value="NE">Nebraska</option>
                                <option value="NV">Nevada</option>
                                <option value="NH">New Hampshire</option>
                                <option value="NJ">New Jersey</option>
                                <option value="NM">New Mexico</option>
                                <option value="NY">New York</option>
                                <option value="NC">North Carolina</option>
                                <option value="ND">North Dakota</option>
                                <option value="OH">Ohio</option>
                                <option value="OK">Oklahoma</option>
                                <option value="OR">Oregon</option>
                                <option value="PA">Pennsylvania</option>
                                <option value="RI">Rhode Island</option>
                                <option value="SC">South Carolina</option>
                                <option value="SD">South Dakota</option>
                                <option value="TN">Tennessee</option>
                                <option value="TX">Texas</option>
                                <option value="UT">Utah</option>
                                <option value="VT">Vermont</option>
                                <option value="VA">Virginia</option>
                                <option value="WA">Washington</option>
                                <option value="WV">West Virginia</option>
                                <option value="WI">Wisconsin</option>
                                <option value="WY">Wyoming</option>
                                <option value="PR">Puerto Rico</option>
                            </select>
                            <span id="stateMsg" class="errorMsg"></span>

                            <input type="text" id="zip" name="zip"
                                pattern="\d{5}(-\d{4})?"
                                maxlength="10"
                                placeholder="ZIP"
                                style="width:60px;"
                                title="ZIP must be 5 digits or ZIP+4 format 77002-1234"
                                required
                                onblur="validateZip()">
                            <span id="zipMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Email-->
                        <td><label for="email">Email:</label></td>
                        <td>
                            <input type="email" id="email" name="email"
                                placeholder="example@email.com"
                                title="Enter a valid email in the format name@domain.tld"
                                required
                                onblur="validateEmail()">
                            <span id="emailMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Symptoms-->
                        <td><label for="symptoms">Describe Current Symptoms:</label></td>
                        <td>
                            <textarea id="symptoms" name="symptoms"
                                rows="3" cols="50"
                                placeholder="Please describe your symptoms..."></textarea>
                            <span id="symptomsMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Checkboxes-->
                        <td>Check all conditions you have had:</td>
                        <td>
                            <input type="checkbox" id="chickenpox" name="conditions" value="chickenpox">
                            <label for="chickenpox">Chicken Pox</label><br>

                            <input type="checkbox" id="measles" name="conditions" value="measles">
                            <label for="measles">Measles</label><br>

                            <input type="checkbox" id="covid" name="conditions" value="covid">
                            <label for="covid">COVID-19</label><br>

                            <input type="checkbox" id="smallpox" name="conditions" value="smallpox">
                            <label for="smallpox">Small Pox</label><br>

                            <input type="checkbox" id="tetanus" name="conditions" value="tetanus">
                            <label for="tetanus">Tetanus</label>
                        </td>
                    </tr>

                    <tr><!--Gender-->
                        <td>Gender:</td>
                        <td>
                            <input type="radio" id="male" name="gender" value="male" required>
                            <label for="male">Male</label>

                            <input type="radio" id="female" name="gender" value="female">
                            <label for="female">Female</label>

                            <input type="radio" id="other" name="gender" value="other">
                            <label for="other">Other</label>
                            <span id="genderMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Vaccinated-->
                        <td>Have you been vaccinated?</td>
                        <td>
                            <input type="radio" id="vaccineYes" name="vaccinated" value="yes" required>
                            <label for="vaccineYes">Yes</label>

                            <input type="radio" id="vaccineNo" name="vaccinated" value="no">
                            <label for="vaccineNo">No</label>
                            <span id="vaccinatedMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Insurance-->
                        <td>Do you have insurance?</td>
                        <td>
                            <input type="radio" id="insuranceYes" name="insurance" value="yes" required>
                            <label for="insuranceYes">Yes</label>

                            <input type="radio" id="insuranceNo" name="insurance" value="no">
                            <label for="insuranceNo">No</label>
                            <span id="insuranceMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Health Slider-->
                        <td><label for="health">On a scale of 1-10, how is your health?</label></td>
                        <td>
                            <input type="range" id="health" name="health"
                                min="1" max="10" value="5"
                                oninput="updateHealth(this.value)">
                            <span id="healthValue">5</span>
                        </td>
                    </tr>

                    <tr><!--User ID-->
                        <td><label for="userid">User ID:</label></td>
                        <td>
                            <input type="text" id="userid" name="userid"
                                minlength="5" maxlength="30"
                                pattern="[A-Za-z][A-Za-z0-9_-]{4,29}"
                                title="5-30 characters. Must start with a letter. Letters, numbers, underscores, and dashes only. No spaces."
                                required
                                onblur="validateUserID()">
                            <span id="useridMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Password-->
                        <td><label for="password">Password:</label></td>
                        <td>
                            <input type="password" id="password" name="password"
                                minlength="8" maxlength="30"
                                title="8-30 characters. Must contain at least 1 uppercase, 1 lowercase, 1 number, and 1 special character. No quotes."
                                required
                                onblur="validatePassword()">
                            <span id="passwordMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Confirm Password-->
                        <td><label for="confirmPassword">Re-enter Password:</label></td>
                        <td>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                title="Must match the password entered above"
                                required
                                onblur="validateConfirmPassword()">
                            <span id="confirmPasswordMsg" class="errorMsg"></span>
                        </td>
                    </tr>

                    <tr><!--Buttons-->
                        <td colspan="3" style="text-align: center; padding-top: 15px;">
                            <input type="reset" value="Clear">
                            <input type="submit" value="Submit">
                            <button type="button" id="reviewButton" onclick="reviewForm()">Review</button>
                        </td>
                    </tr>

                </table>
            </form>
        </div>
    </div>

    <!--Footer-->
    <div id="footer">
        <p>Cedarwood Medical Center</p>
        <a href="mailto:dmpham8@cougarnet.uh.edu" class="email-btn">Contact Us</a>
    </div>

    <script>
        document.getElementById("currentDate").innerHTML = new Date().toLocaleDateString();
    </script>

    <!--Review Form-->
    <div id="reviewForm" class="reviewForm">
        <h2 class="reviewTitle">REVIEW FORM</h2>
        <table id="reviewTable">
            <thead>
                <tr>
                    <th>Field</th>
                    <th>Value</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <br>
        <button type="button" onclick="closeReviewForm()">Close</button>
    </div>

</body>
</html>
